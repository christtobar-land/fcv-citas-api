spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citas_fcv_training}?serverTimezone=America/Bogota
    username: ${DB_USER:citas_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
server:
  error:
    include-message: never
app:
  jwt:
    issuer: citas-api
    access-secret: ${JWT_ACCESS_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cookie:
    secure: ${REFRESH_COOKIE_SECURE:true}
    same-site: ${REFRESH_COOKIE_SAME_SITE:None}
  n8n:
    enabled: ${N8N_ENABLED:false}
    webhook-url: ${N8N_WEBHOOK_URL:}
    webhook-secret: ${N8N_WEBHOOK_SECRET:}
    service-token: ${N8N_SERVICE_TOKEN:}
    timeout-seconds: ${N8N_TIMEOUT_SECONDS:5}
    max-attempts: ${N8N_MAX_ATTEMPTS:3}
